name: Deploy CANSLIM Dashboard to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Only one deployment runs at a time. Queue, don't cancel: cancelling a Pages
# deploy mid-flight can leave it half-done, and at 21:00 two jobs push within
# a minute of each other. (GitHub's own Pages starter workflow uses false.)
concurrency:
  group: "pages"
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.retry1.outputs.page_url || steps.retry2.outputs.page_url }}
    runs-on: ubuntu-latest
    # Actions bumped 25 Nov 2026 from the 2024 Node-20 majors (checkout@v4,
    # configure-pages@v5, upload-pages-artifact@v3, deploy-pages@v4). GitHub
    # now forces those onto Node 24, and from 23 Nov deploy-pages@v4 started
    # failing with 'No artifacts named "github-pages" were found' (5 of 8
    # deploys on 25 Nov). These are the current Node-24 majors.
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: "."

      # Retry the deploy STEP, inside this same run (added 26 Nov 2026). Since
      # 23 Nov the deploy has often failed within a second of a successful
      # upload with 'No artifacts named "github-pages" were found' (5 of 6
      # failed on the evening of 25 Nov, on both the old and the new action
      # versions): the fresh upload is apparently not visible yet. Waiting
      # and asking again uses the SAME artifact. This is not a re-run of the
      # workflow, which re-uploads and fails with "Multiple artifacts".
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait 30s before retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 30

      - name: Deploy to GitHub Pages (retry 1)
        id: retry1
        if: steps.deployment.outcome == 'failure'
        continue-on-error: true
        uses: actions/deploy-pages@v5

      - name: Wait 60s before retry
        if: steps.deployment.outcome == 'failure' && steps.retry1.outcome == 'failure'
        run: sleep 60

      - name: Deploy to GitHub Pages (retry 2)
        id: retry2
        if: steps.deployment.outcome == 'failure' && steps.retry1.outcome == 'failure'
        uses: actions/deploy-pages@v5
